[project]
name = "ztp-clinic"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = ["cryptography>=43", "pytest>=8", "ruff>=0.8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
