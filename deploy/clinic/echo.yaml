apiVersion: v1
kind: ServiceAccount
metadata: {name: echo-a, namespace: clinic}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: echo-a, namespace: clinic}
spec:
  replicas: 1
  selector: {matchLabels: {app: echo-a}}
  template:
    metadata: {labels: {app: echo-a}}
    spec:
      serviceAccountName: echo-a
      containers:
        - name: app
          image: ztp/echo:dev
          imagePullPolicy: Never
          env:
            - {name: WORKLOAD_NAME, value: echo-a}
            - {name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///spiffe-workload-api/spire-agent.sock"}
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: spiffe, mountPath: /spiffe-workload-api, readOnly: true}]
      volumes:
        - name: spiffe
          csi: {driver: csi.spiffe.io, readOnly: true}
