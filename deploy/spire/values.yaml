# Upstream SPIRE (spiffe/helm-charts-hardened). Trust domain and cluster name are
# the only identity-relevant knobs the playground sets.
global:
  spire:
    clusterName: ztp
    trustDomain: playground.local
tornjak-frontend:
  enabled: false
spire-server:
  controllerManager:
    identities:
      clusterSPIFFEIDs:
        # The chart's catch-all (fallback) ID would keep issuing identities to any pod
        # once the explicit ClusterSPIFFEID is removed. No registration should mean no identity.
        default:
          enabled: false
