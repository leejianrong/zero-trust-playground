# The scripted agent. SIMULATION: it obeys instructions hidden in tool results (ADR-0008).
apiVersion: v1
kind: Namespace
metadata: {name: agents}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: agent, namespace: agents}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent, namespace: agents}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent}}
  template:
    metadata: {labels: {app: agent}}
    spec:
      serviceAccountName: agent
      containers:
        - name: app
          image: ztp/clinic:dev
          imagePullPolicy: Never
          command: [python, -m, clinic.serve, "clinic.agent:app", --mtls]
          ports: [{containerPort: 8080}]
          env:
            - {name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///spiffe-workload-api/spire-agent.sock"}
            - {name: AGENT_OBEYS_INJECTED_TEXT, value: "true"}
          volumeMounts: [{name: spiffe, mountPath: /spiffe-workload-api, readOnly: true}]
      volumes: [{name: spiffe, csi: {driver: csi.spiffe.io, readOnly: true}}]
---
apiVersion: v1
kind: Service
metadata: {name: agent, namespace: agents}
spec:
  selector: {app: agent}
  ports: [{name: http, port: 8080, targetPort: 8080}, {name: mtls, port: 8443, targetPort: 8443}]
