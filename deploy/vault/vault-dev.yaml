# SPIKE (AAL-64): Vault in dev mode. In-memory, unsealed, a fixed root token. Throwaway and localhost-only.
# Replaced by the real install in AAL-65.
apiVersion: v1
kind: Namespace
metadata: {name: vault}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: vault, namespace: vault}
spec:
  replicas: 1
  selector: {matchLabels: {app: vault}}
  template:
    metadata: {labels: {app: vault}}
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:2.1.2
        args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200", "-dev-root-token-id=playground-dev-root"]
        ports: [{containerPort: 8200}]
        readinessProbe: {httpGet: {path: /v1/sys/health, port: 8200}}
---
apiVersion: v1
kind: Service
metadata: {name: vault, namespace: vault}
spec:
  selector: {app: vault}
  ports: [{port: 8200}]
