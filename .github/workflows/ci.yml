name: ci
on:
  push: {branches: [main]}
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  observer:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/observer}}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
  clinic:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/clinic}}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  e2e:
    needs: [observer, clinic, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The full stack needs about 2.4 GiB; the 2g default is for the 8 GB laptop. Leave the CPUs uncapped here.
      CLUSTER_MEM: 5g
      CLUSTER_CPUS: ""
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - uses: actions/setup-node@v5
        with: {node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.9.0 bash
      - name: Start resource sampler
        run: |
          nproc; free -m; df -h / | tail -1
          nohup scripts/ci-sample.sh "$RUNNER_TEMP/resources.log" 10 >/dev/null 2>&1 &
      - run: make up
      - run: make echo
      - run: make clinic
      - run: make headlamp
      - run: make vault
      - run: make eso
      - run: make keycloak
      - run: uv sync --frozen
        working-directory: services/observer
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Cluster state before the tests
        run: |
          free -m
          kubectl --context k3d-ztp get pods -A -o wide
          kubectl --context k3d-ztp top pods -A || true
      # `list` prints each test and its duration, so a slow test or a long gap stands out in the log.
      - run: npx playwright test --reporter=list --trace=retain-on-failure
        working-directory: web
      - name: Resource samples
        if: always()
        run: cat "$RUNNER_TEMP/resources.log"
      - name: Cluster state after a failure
        if: failure()
        run: |
          free -m
          kubectl --context k3d-ztp top pods -A || true
          kubectl --context k3d-ztp get pods -A -o wide
          kubectl --context k3d-ztp -n clinic get cm layer-modes -o jsonpath='{.data}'; echo
          for d in web records-api billing postgres; do echo "== $d"; kubectl --context k3d-ztp -n clinic logs deploy/$d --tail=80 || true; done
          kubectl --context k3d-ztp get events -A --sort-by=.lastTimestamp | tail -30
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: e2e-screenshots, path: web/e2e/screenshots}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            ${{ runner.temp }}/resources.log
            web/test-results
