name: ci
on:
  push: {branches: [main]}
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  observer:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/observer}}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
  clinic:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/clinic}}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  e2e:
    needs: [observer, clinic, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - uses: actions/setup-node@v5
        with: {node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.9.0 bash
      - run: make up
      - run: make echo
      - run: make clinic
      - run: make headlamp
      - run: make vault
      - run: make eso
      - run: uv sync --frozen
        working-directory: services/observer
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: e2e-screenshots, path: web/e2e/screenshots}
