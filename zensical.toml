[project]
site_url = "https://leejianrong.github.io/zero-trust-playground/"
site_name = "Zero Trust Playground"
site_description = "Learn the Layered Zero Trust pattern by attacking a toy clinic app on a local k3d cluster, with a dashboard that shows what each layer stops."
docs_dir = "docs/tutorial"

repo_url = "https://github.com/leejianrong/zero-trust-playground"
repo_name = "leejianrong/zero-trust-playground"
edit_uri = "edit/main/docs/tutorial/"

nav = [
  { "Start here" = "index.md" },
  { "Tutorials" = [
    { "Get started" = "get-started.md" },
    { "Workload identity" = "workload-identity.md" },
    { "The open clinic" = "the-open-clinic.md" },
    { "Agents and MCP" = "agents-and-mcp.md" },
  ] },
  { "How-to guides" = [
    { "Read the cluster with Headlamp" = "how-to/read-the-cluster-with-headlamp.md" },
  ] },
  { "Concepts" = [
    { "Layered zero trust" = "concepts/layered-zero-trust.md" },
  ] },
  { "Reference" = [
    { "Make targets" = "reference/make-targets.md" },
    { "Observer API" = "reference/observer-api.md" },
    { "Attacks" = "reference/attacks.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/leejianrong/zero-trust-playground"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
